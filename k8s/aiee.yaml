apiVersion: v1
kind: Namespace
metadata:
  name: aiee

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiee-backend
  namespace: aiee
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aiee-backend
  template:
    metadata:
      labels:
        app: aiee-backend
    spec:
      containers:
        - name: backend
          image: aiee-backend:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: GITHUB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: aiee-secrets
                  key: GITHUB_CLIENT_ID
            - name: GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: aiee-secrets
                  key: GITHUB_CLIENT_SECRET
            - name: GITHUB_REDIRECT_URI
              valueFrom:
                secretKeyRef:
                  name: aiee-secrets
                  key: GITHUB_REDIRECT_URI
            - name: FRONTEND_URL
              valueFrom:
                secretKeyRef:
                  name: aiee-secrets
                  key: FRONTEND_URL
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: aiee-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aiee-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: aiee-secrets
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                secretKeyRef:
                  name: aiee-secrets
                  key: POSTGRES_PORT
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: aiee-secrets
                  key: POSTGRES_DB

---
apiVersion: v1
kind: Service
metadata:
  name: aiee-backend
  namespace: aiee
spec:
  selector:
    app: aiee-backend
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  type: ClusterIP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiee-frontend
  namespace: aiee
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aiee-frontend
  template:
    metadata:
      labels:
        app: aiee-frontend
    spec:
      containers:
        - name: frontend
          image: aiee-frontend:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: aiee-frontend
  namespace: aiee
spec:
  selector:
    app: aiee-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080
  type: NodePort